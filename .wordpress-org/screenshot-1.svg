<!-- Canvas is square (1280x1280) so qlmanage rasterises it 1:1; the final PNG is
     top-cropped to 1280x960 (bin/pngcrop via .wordpress-org tooling). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-label="Freshet Feeds — rendered feed">
  <rect width="1280" height="1280" fill="#f4f4f5"/>

  <!-- header -->
  <text x="80" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#2d2d2d" letter-spacing="-1">Latest updates</text>
  <text x="82" y="132" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#6b6b6b">Rendered by your theme — Freshet Feeds</text>
  <g>
    <rect x="1024" y="64" width="176" height="44" rx="22" fill="#0A1499"/>
    <text x="1112" y="93" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Freshet Feeds</text>
  </g>

  <!-- cards: 2 x 2 grid -->
  <!-- card template values: x, y -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(80,184)">
      <rect width="520" height="332" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="150" rx="18" fill="#dfe3ff"/>
      <rect x="0" y="130" width="520" height="20" fill="#dfe3ff"/>
      <circle cx="44" cy="196" r="20" fill="#0A1499"/>
      <text x="80" y="192" font-size="19" font-weight="700" fill="#2d2d2d">@freshet.studio</text>
      <text x="80" y="214" font-size="15" font-weight="500" fill="#8FA998">Mastodon &#183; 2d ago</text>
      <rect x="40" y="244" width="360" height="16" rx="8" fill="#d4d4d8"/>
      <rect x="40" y="272" width="440" height="12" rx="6" fill="#e4e4e7"/>
      <rect x="40" y="294" width="300" height="12" rx="6" fill="#e4e4e7"/>
    </g>
    <!-- row 1 col 2 -->
    <g transform="translate(680,184)">
      <rect width="520" height="332" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="150" rx="18" fill="#e7f0ff"/>
      <rect x="0" y="130" width="520" height="20" fill="#e7f0ff"/>
      <circle cx="44" cy="196" r="20" fill="#c00"/>
      <text x="80" y="192" font-size="19" font-weight="700" fill="#2d2d2d">Channel</text>
      <text x="80" y="214" font-size="15" font-weight="500" fill="#8FA998">YouTube &#183; 5d ago</text>
      <rect x="40" y="244" width="300" height="16" rx="8" fill="#d4d4d8"/>
      <rect x="40" y="272" width="440" height="12" rx="6" fill="#e4e4e7"/>
      <rect x="40" y="294" width="380" height="12" rx="6" fill="#e4e4e7"/>
    </g>
    <!-- row 2 col 1 -->
    <g transform="translate(80,560)">
      <rect width="520" height="332" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="150" rx="18" fill="#e6f7ff"/>
      <rect x="0" y="130" width="520" height="20" fill="#e6f7ff"/>
      <circle cx="44" cy="196" r="20" fill="#1185fe"/>
      <text x="80" y="192" font-size="19" font-weight="700" fill="#2d2d2d">@handle</text>
      <text x="80" y="214" font-size="15" font-weight="500" fill="#8FA998">Bluesky &#183; 1w ago</text>
      <rect x="40" y="244" width="400" height="16" rx="8" fill="#d4d4d8"/>
      <rect x="40" y="272" width="420" height="12" rx="6" fill="#e4e4e7"/>
      <rect x="40" y="294" width="260" height="12" rx="6" fill="#e4e4e7"/>
    </g>
    <!-- row 2 col 2 -->
    <g transform="translate(680,560)">
      <rect width="520" height="332" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="150" rx="18" fill="#fff0e6"/>
      <rect x="0" y="130" width="520" height="20" fill="#fff0e6"/>
      <circle cx="44" cy="196" r="20" fill="#ee802f"/>
      <text x="80" y="192" font-size="19" font-weight="700" fill="#2d2d2d">Blog</text>
      <text x="80" y="214" font-size="15" font-weight="500" fill="#8FA998">RSS &#183; 2w ago</text>
      <rect x="40" y="244" width="340" height="16" rx="8" fill="#d4d4d8"/>
      <rect x="40" y="272" width="440" height="12" rx="6" fill="#e4e4e7"/>
      <rect x="40" y="294" width="320" height="12" rx="6" fill="#e4e4e7"/>
    </g>
  </g>
</svg>
