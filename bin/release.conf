# Freshet release toolchain — the per-plugin half.
#
# bin/build-release.sh, bin/deploy-svn.sh, bin/render-assets.sh and
# bin/pngcrop.js are identical in every Freshet plugin repo. Everything that
# differs between plugins is data and lives here.

SLUG="freshet-feeds"
VERSION_FILE="freshet-feeds.php"
VERSION_CONST="FRESHET_FEEDS_VERSION"

# Build steps this plugin needs (1 = run, 0 = skip).
BUILD_NPM=1        # `npm run build` compiles the block before staging
BUILD_COMPOSER=1   # install without dev deps, then restore them afterwards
SALES_ZIP=1        # this plugin also sells direct, so build both archives
TAG_RELEASE=1      # leave a local v<version> tag behind on a clean tree

# Excluded on top of the shared baseline in bin/build-release.sh.
EXTRA_EXCLUDES=(
  'HANDBOOK.md'
  'data/fixtures/rss2-sample.xml'
  'data/fixtures/atom-youtube.xml'
  'data/fixtures/bluesky-feed.json'
)

# Removed from the wp.org archive only — directory guidelines 5 & 8 allow no
# license checks, no update injection and no upsell surfaces. The whole of the
# paid tier goes: the license interface and client, the update checker, the
# License tab with its pill, and the one bootstrap that wires them, so the
# directory build carries no tier at all — nothing locked, nothing that reads
# a license, nothing that names one. Plugin.php asks for Extension\Bootstrap
# once and moves on when it is not there.
WPORG_STRIP=(
  'src/Extension/Bootstrap.php'
  'src/License/LicenseInterface.php'
  'src/License/UpdateChecker.php'
  'src/License/RemoteLicense.php'
  'src/License/LicenseClient.php'
  'src/Admin/LicenseSection.php'
  # The template is generated from the whole tree, so it carries the paid
  # strings; wordpress.org builds language packs from the code and never
  # reads a shipped .pot.
  'languages/freshet-feeds.pot'
)

# wp.org page assets to rasterise: <svg> <render-size> <out.png> <crop-height>
ASSET_RENDERS=(
  'screenshot-1.svg 1280 screenshot-1.png 960'
)

# wordpress.org SVN.
SVN_USER="kristoffbertram"
